<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joyas & Arte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #faf6f2;
            color: #2c1810;
            padding-bottom: 60px;
        }

        /* HEADER */
        header {
            background: linear-gradient(135deg, #2c1810 0%, #4a2c1a 100%);
            color: #f5e6d0;
            text-align: center;
            padding: 40px 20px 30px;
            position: relative;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 3px;
            font-weight: 300;
            text-transform: uppercase;
        }

        header p {
            margin-top: 8px;
            font-size: 0.95rem;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* CATEGORY TABS */
        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 20px 16px 10px;
            position: sticky;
            top: 0;
            background: #faf6f2;
            z-index: 10;
        }

        .categories button {
            padding: 8px 18px;
            border: 1px solid #c4a882;
            border-radius: 20px;
            background: transparent;
            color: #4a2c1a;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .categories button.active,
        .categories button:hover {
            background: #4a2c1a;
            color: #f5e6d0;
            border-color: #4a2c1a;
        }

        /* PRODUCT GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 16px;
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(44, 24, 16, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(44, 24, 16, 0.12);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #eee;
            display: block;
        }

        .card-body {
            padding: 12px 14px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-body h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #2c1810;
            margin-bottom: 4px;
        }

        .card-body .precio {
            font-size: 1rem;
            font-weight: 700;
            color: #8b5e3c;
            margin-bottom: 6px;
        }

        .card-body .descripcion {
            font-size: 0.8rem;
            color: #7a6a5e;
            margin-bottom: 12px;
            flex: 1;
            line-height: 1.4;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #25d366;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            font-family: inherit;
            width: 100%;
        }

        .btn-whatsapp:hover {
            background: #1da851;
        }

        .btn-whatsapp svg {
            width: 18px;
            height: 18px;
            fill: #fff;
            flex-shrink: 0;
        }

        /* EMPTY STATE */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #7a6a5e;
            grid-column: 1 / -1;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #7a6a5e;
            font-size: 0.85rem;
        }

        footer a {
            color: #25d366;
            text-decoration: none;
            font-weight: 600;
        }

        /* RESPONSIVE */
        @media (min-width: 600px) {
            header h1 { font-size: 2.5rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        }

        @media (min-width: 900px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<header>
    <h1>✦ Joyas & Arte</h1>
    <p>Catálogo exclusivo</p>
</header>

<!-- FILTROS -->
<div class="categories" id="categories"></div>

<!-- PRODUCTOS -->
<div class="grid" id="grid"></div>

<footer>
    <p>¿Prefieres pedir por WhatsApp directamente?</p>
    <a href="https://wa.me/526421406065" target="_blank">¦ Envíanos un mensaje ¦</a>
</footer>

<script>
    // ──── CONFIGURACIÓN ────
    const WHATSAPP_NUMBER = '526421406065';
    const WHATSAPP_MESSAGE = 'Hola, me interesa esta joya:';

    const grid = document.getElementById('grid');
    const categoriesContainer = document.getElementById('categories');
    let productos = [];

    async function cargar() {
        try {
            const r = await fetch('productos.json?_=' + Date.now());
            productos = await r.json();
        } catch (e) {
            grid.innerHTML = '<div class="empty">Error al cargar el catálogo.</div>';
            return;
        }
        initCategories();
        render();
    }

    function getCategories() {
        return ['Todas', ...new Set(productos.map(p => p.categoria))];
    }

    function render(categoriaFiltro = 'Todas') {
        const filtrados = categoriaFiltro === 'Todas'
            ? productos
            : productos.filter(p => p.categoria === categoriaFiltro);

        if (filtrados.length === 0) {
            grid.innerHTML = '<div class="empty">No hay productos en esta categor\u00eda.</div>';
            return;
        }

        grid.innerHTML = filtrados.map(p => `
            <div class="card">
                <img class="card-img" src="${p.imagen}" alt="${p.nombre}" loading="lazy"
                     onerror="this.src='img/placeholder.svg'">
                <div class="card-body">
                    <h3>${p.nombre}</h3>
                    <div class="precio">${p.precio}</div>
                    <div class="descripcion">${p.descripcion}</div>
                    <a class="btn-whatsapp"
                       href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(WHATSAPP_MESSAGE + ' *' + p.nombre + '*%0a%0a' + p.descripcion + '%0aPrecio: ' + p.precio)}"
                       target="_blank"
                       rel="noopener noreferrer">
                        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                        Consultar por WhatsApp
                    </a>
                </div>
            </div>
        `).join('');
    }

    function initCategories() {
        const cats = getCategories();
        categoriesContainer.innerHTML = cats.map(c =>
            `<button class="${c === 'Todas' ? 'active' : ''}" data-cat="${c}">${c}</button>`
        ).join('');

        categoriesContainer.addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            categoriesContainer.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(btn.dataset.cat);
        });
    }

    cargar();
</script>
</body>
</html>
